name: HNG Stage 2 CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4 for better Node.js 20 support

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated to v5 to avoid deprecation warnings
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install flake8 pytest
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      - name: Run Linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        run: pytest api/tests/

      - name: Build and Run with Compose
        run: |
          docker compose build
          docker compose up -d
          sleep 20
          docker compose ps
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: docker compose down
