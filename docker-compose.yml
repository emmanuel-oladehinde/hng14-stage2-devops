version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: hng_redis
    restart: always
    expose:
      - "6379"
    networks:
      - hng_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: hng_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - hng_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  worker:
    build: ./worker
    container_name: hng_worker
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - hng_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  frontend:
    build: ./frontend
    container_name: hng_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    networks:
      - hng_network
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  hng_network:
    driver: bridge
